name: Linux Release Truth

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - reset/**
      - codex/**

defaults:
  run:
    shell: bash

jobs:
  release-truth:
    name: Linux release authority
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      TZ: America/Chicago
      NODE_ENV: test
      DB_URL: postgres://postgres:postgres@localhost:5432/pmc
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-current-secret
      JWT_SECRET_PREVIOUS: ci-previous-secret
      INTERNAL_SOCKET_SECRET: ci-internal-socket-secret
      ALLOW_DEV_LOGIN: "true"
      ALLOW_PASSWORD_LOGIN: "true"
      ALLOW_PASSWORD_LOGIN_BREAK_GLASS_ONLY: "false"
      API_PUBLIC_URL: http://localhost:4000
      ADMIN_WEB_URL: http://localhost:5173
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pmc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pmc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Record release authority policy
        run: |
          {
            echo "## Release Authority"
            echo ""
            echo "- Linux CI is the only release authority for Mission Control."
            echo "- Windows local runs are advisory only and must not be used as release truth."
            echo "- Release requires builds, migrations, full tests, and the pilot smoke suite to pass in this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Phase 1 freeze manifest
        env:
          GITHUB_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PHASE1_FREEZE_EXCEPTION_APPROVED: ${{ github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'architect-approved-freeze-exception') && 'true' || 'false' }}
        run: npm run check:phase1-freeze

      - name: Prepare local env file
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Verify clean release candidate before validation
        run: npm run verify:release:clean

      - name: Wait for Postgres and Redis readiness
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: |
          set -euo pipefail

          find_container() {
            local image_pattern="$1"
            docker ps --format '{{.ID}} {{.Image}} {{.Names}}' 2>/dev/null | awk -v pattern="$image_pattern" 'BEGIN { pattern = tolower(pattern) } { line = tolower($0); if (index(line, pattern) > 0) { print $1; exit } }' || true
          }

          check_postgres() {
            if command -v pg_isready >/dev/null 2>&1; then
              pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U postgres -d pmc >/dev/null 2>&1
              return $?
            fi

            local container
            container="$(find_container postgres)"
            if [ -n "$container" ]; then
              docker exec "$container" pg_isready -U postgres -d pmc >/dev/null 2>&1
              return $?
            fi

            return 1
          }

          check_redis() {
            if command -v redis-cli >/dev/null 2>&1; then
              redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" ping 2>/dev/null | grep -q PONG
              return $?
            fi

            local container
            container="$(find_container redis)"
            if [ -n "$container" ]; then
              docker exec "$container" redis-cli ping 2>/dev/null | grep -q PONG
              return $?
            fi

            return 1
          }

          print_readiness_diagnostics() {
            echo "Postgres and Redis were not ready in time." >&2
            echo "Client availability:" >&2
            if command -v pg_isready >/dev/null 2>&1; then
              pg_isready --version >&2 || true
            else
              echo "- pg_isready is not available on the runner PATH." >&2
            fi

            if command -v redis-cli >/dev/null 2>&1; then
              redis-cli --version >&2 || true
            else
              echo "- redis-cli is not available on the runner PATH." >&2
            fi

            echo "Docker containers:" >&2
            docker ps -a --format 'table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.Names}}' >&2 || true

            for container in "$(find_container postgres)" "$(find_container redis)"; do
              if [ -n "$container" ]; then
                echo "Container ${container} health:" >&2
                docker inspect --format '{{.Name}} {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container" >&2 || true
                echo "Container ${container} recent logs:" >&2
                docker logs --tail 80 "$container" >&2 || true
              fi
            done

            echo "Listening sockets:" >&2
            (ss -ltnp || netstat -ltnp || true) 2>&1 | grep -E ':(5432|6379)\b' >&2 || true
          }

          for attempt in {1..90}; do
            postgres_ready=false
            redis_ready=false

            if check_postgres; then
              postgres_ready=true
            fi

            if check_redis; then
              redis_ready=true
            fi

            if [ "$postgres_ready" = "true" ] && [ "$redis_ready" = "true" ]; then
              echo "Postgres and Redis are ready after ${attempt} attempt(s)."
              exit 0
            fi

            if (( attempt % 10 == 0 )); then
              echo "Waiting for services: attempt ${attempt}/90 (postgres=${postgres_ready}, redis=${redis_ready})"
            fi

            sleep 2
          done

          print_readiness_diagnostics
          exit 1

      - name: Run migrations
        run: npm run db:migrate

      - name: Seed demo data
        run: npm run db:seed

      - name: Run shared pilot-mode release gate
        run: npm run verify:pilot-mode
